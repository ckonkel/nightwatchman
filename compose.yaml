services:
  gluetun:
    image: ${GLUETUN_IMAGE:?required}
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?required}
      OPENVPN_USER: ${OPENVPN_USER:?required}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:?required}
      SERVER_REGIONS: ${SERVER_REGIONS:?required}
    ports:
      - target: ${WEBUI_PORT:?required}
        published: ${WEBUI_PORT:?required}
        protocol: tcp
      - target: ${TORRENTING_PORT:?required}
        published: ${TORRENTING_PORT:?required}
        protocol: tcp
      - target: ${TORRENTING_PORT:?required}
        published: ${TORRENTING_PORT:?required}
        protocol: udp
      - target: 9117
        published: ${JACKETT_PORT:?required}
        protocol: tcp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  qbittorrent:
    image: ${QBITTORRENT_IMAGE:?required}
    container_name: qBittorrent
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      WEBUI_PORT: ${WEBUI_PORT:?required}
      TORRENTING_PORT: ${TORRENTING_PORT:?required}
      PUID: ${PUID:?required}
      PGID: ${PGID:?required}
      TZ: ${TZ:?required}
    volumes:
      - ${CONFIG_PATH:?required}:/config
      - ${DOWNLOADS_PATH:?required}:/downloads
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  jackett:
    image: ${JACKETT_IMAGE:?required}
    container_name: jackett
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:?required}
      PGID: ${PGID:?required}
      TZ: ${TZ:?required}
      AUTO_UPDATE: "false"
    volumes:
      - ${JACKETT_CONFIG_PATH:?required}:/config
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --show-error --output /dev/null --write-out '%{http_code}'
          --max-time 5 http://127.0.0.1:9117/UI/Dashboard |
          grep -Eq '^(2[0-9]{2}|3[0-9]{2}|401|403)$'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
